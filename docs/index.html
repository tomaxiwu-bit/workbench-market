<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF9F5' stroke='%23E5E2D8'/%3E%3Ctext x='32' y='45' font-size='34' font-family='Georgia,serif' fill='%23D97757' text-anchor='middle'%3E%E5%8F%B0%3C/text%3E%3C/svg%3E">

<meta property="og:description" content="23 个豆包工作场景工作台：15 个用户亲手调的配方，其中 5 条复制链接就能导入。">

<meta name="twitter:title" content="工作台市集 · 把好用的工作台交给同路的人">

<meta name="twitter:image" content="https://tomaxiwu-bit.github.io/workbench-market/shots/3.jpg">
<style>
  :root{
    --paper:#FAF9F5; --paper-2:#F4F1E8; --card:#FFFFFF;
    --ink:#141413; --ink-soft:#3D3B36; --muted:#78756E;
    --line:#E5E2D8; --line-soft:#EFECE3;
    --accent:#D97757; --accent-deep:#B85F40; --accent-soft:#FBEDE6;
    --warn:#A8462A;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --mono:"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ---------- 顶栏 ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:rgba(250,249,245,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .top-inner{display:flex;align-items:center;gap:26px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;letter-spacing:.01em}
  .mark{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--accent);
    color:var(--accent);display:grid;place-items:center;
    font-family:var(--serif);font-size:14px;line-height:1;background:#fff
  }
  nav.links{display:flex;gap:2px;margin-left:auto}
  nav.links a{padding:7px 12px;border-radius:7px;font-size:13.5px;color:var(--muted);transition:color .15s}
  nav.links a:hover{color:var(--ink)}
  nav.links a.on{color:var(--ink);font-weight:600}

  /* ---------- 首页 ---------- */
  .hero{padding:76px 0 22px}
  .eyebrow{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:18px
  }
  .hero h1{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(32px,4.6vw,54px);line-height:1.14;letter-spacing:-.015em;
    margin:0 0 18px;max-width:820px
  }
  .hero h1 em{font-style:italic;color:var(--accent-deep)}
  .hero p.lead{margin:0;max-width:600px;color:var(--muted);font-size:15.5px;line-height:1.8}
  .statline{
    display:flex;flex-wrap:wrap;gap:0;margin:34px 0 0;
    border-top:1px solid var(--line-soft);padding-top:18px
  }
  .stat{padding-right:38px;margin-right:38px;border-right:1px solid var(--line-soft)}
  .stat:last-child{border:0;margin-right:0}
  .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:34px 0 16px}
  .search{flex:1;min-width:240px;position:relative}
  .search input{
    width:100%;height:42px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;padding:0 14px 0 36px;font-size:14px;outline:none;
    color:var(--ink);font-family:inherit;transition:border-color .15s
  }
  .search input::placeholder{color:#A7A39A}
  .search input:focus{border-color:#C9C4B6}
  .search .ico{position:absolute;left:12px;top:10px;color:#A7A39A;font-size:14px}
  .seg{display:flex;gap:2px;background:var(--paper-2);border-radius:8px;padding:3px}
  .seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font-size:12.5px;color:var(--muted);transition:.15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,19,.05)}
  select.sort{
    height:42px;border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:0 10px;font-size:12.5px;color:var(--ink-soft);outline:none;font-family:inherit
  }

  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:26px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    border:1px solid transparent;background:transparent;color:var(--muted);
    border-radius:7px;padding:5px 11px;font-size:12.5px;white-space:nowrap;transition:.15s
  }
  .chip:hover{color:var(--ink);background:var(--paper-2)}
  .chip.on{background:var(--ink);color:#FAF9F5;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:24px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:11px;padding:22px 22px 16px;
    display:flex;flex-direction:column;gap:11px;cursor:pointer;
    transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease
  }
  .card:hover{border-color:#D8D3C5;box-shadow:0 1px 2px rgba(20,20,19,.04),0 8px 22px rgba(20,20,19,.05);transform:translateY(-2px)}
  .card-head{display:flex;align-items:flex-start;gap:12px}
  .ico-box{
    width:38px;height:38px;border-radius:8px;flex:none;display:grid;place-items:center;
    background:var(--paper-2);border:1px solid var(--line-soft);
    font-family:var(--serif);font-size:16px;color:var(--ink);
    line-height:1
  }
  .card-title{font-size:15.5px;font-weight:600;line-height:1.4;margin:0;letter-spacing:-.005em}
  .card-author{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
  .badge{
    font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--paper-2);
    color:var(--muted);white-space:nowrap;letter-spacing:.02em;align-self:flex-start
  }
  .badge.official{background:var(--accent-soft);color:var(--accent-deep)}
  .card-summary{
    font-size:13.5px;color:#4A4742;line-height:1.7;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px
  }
  .card-quote{
    font-family:var(--serif);font-size:12.5px;line-height:1.6;color:#7C776C;font-style:italic;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
    padding-left:9px;border-left:2px solid var(--accent-soft);margin-top:-2px
  }
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;color:#6E6A61;background:var(--paper-2);padding:2px 8px;border-radius:5px;letter-spacing:.01em}
  .card-foot{
    display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:13px;
    border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)
  }
  .card-foot .copy{
    margin-left:auto;border:0;background:transparent;padding:0;font-size:11.5px;
    color:var(--ink-soft);border-bottom:1px solid transparent;transition:.15s
  }
  .card-foot .copy:hover{color:var(--accent-deep);border-bottom-color:var(--accent-deep)}

  .empty{text-align:center;padding:72px 20px;color:var(--muted);font-size:14px}
  .empty b{display:block;font-family:var(--serif);font-weight:400;font-size:18px;color:var(--ink);margin-bottom:6px}

  /* ---------- 弹层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(20,20,19,.34);display:none;z-index:60;padding:26px;overflow:auto;backdrop-filter:blur(2px)}
  .mask.show{display:block}
  .sheet{
    max-width:680px;margin:24px auto;background:#FDFCF8;border:1px solid var(--line);
    border-radius:13px;padding:30px;box-shadow:0 20px 50px rgba(20,20,19,.16);
    animation:up .22s ease
  }
  @keyframes up{from{transform:translateY(10px);opacity:.72}to{transform:none;opacity:1}}
  .sheet-head{display:flex;gap:14px;align-items:flex-start}
  .sheet-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.3;letter-spacing:-.01em}
  .x{
    margin-left:auto;border:1px solid var(--line);background:transparent;width:28px;height:28px;
    border-radius:7px;font-size:13px;color:var(--muted);line-height:1;flex:none
  }
  .x:hover{background:var(--paper-2);color:var(--ink)}
  .meta-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:16px 0 2px}
  .block{margin-top:20px}
  .block h3{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 9px
  }
  .block p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.8;white-space:pre-wrap}
  .block p.q{
    font-family:var(--serif);font-size:15.5px;line-height:1.75;color:#4A4238;
    border-left:3px solid var(--accent);padding-left:14px;white-space:normal
  }
  .link-box{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .link-box input{
    flex:1;min-width:200px;height:40px;border:1px solid var(--line);border-radius:8px;
    padding:0 12px;font-size:12px;color:var(--muted);background:#fff;outline:none;
    font-family:var(--mono)
  }
  .btn{
    border:1px solid var(--line);background:var(--card);border-radius:8px;
    padding:9px 15px;font-size:13px;color:var(--ink);transition:.15s;line-height:1.4
  }
  .btn:hover{border-color:#D3CEC0;background:#FCFBF6}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#FAF9F5;font-weight:500}
  .btn.primary:hover{background:#2C2A27;border-color:#2C2A27}
  .btn.ghost{background:transparent}
  .btn.big{padding:13px 26px;font-size:14.5px;border-radius:9px;display:inline-block;text-decoration:none}
  .btn.primary.big{background:var(--accent-deep);border-color:var(--accent-deep);color:#FDF8F4}
  .btn.primary.big:hover{background:#A65A39;border-color:#A65A39}
  .submit-main{padding:4px 0 30px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .sub-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.75}
  .prep{margin-bottom:36px;max-width:720px}
  .prep-head{font-family:var(--serif);font-size:15.5px;margin-bottom:14px}
  .prep ol{margin:0;padding:0;list-style:none;display:grid;gap:11px}
  .prep li{font-size:13.5px;line-height:1.75}
  .prep li b{font-family:var(--serif);font-weight:500;margin-right:9px;color:var(--ink)}
  .prep li span{color:var(--muted)}
  .alt{max-width:720px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:22px 24px}
  .alt-head{font-family:var(--serif);font-size:15.5px;margin-bottom:8px}
  .alt p{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.75}
  .alt textarea{
    width:100%;min-height:158px;font-family:var(--mono);font-size:12px;line-height:1.9;
    border:1px solid var(--line);border-radius:8px;padding:13px;background:var(--paper);
    color:var(--ink-soft);resize:vertical;margin-bottom:12px
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .sheet-foot{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap;align-items:center;padding-top:18px;border-top:1px solid var(--line-soft)}
  .tip{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
  .report{margin-left:auto;border:0;background:transparent;color:#A7A39A;font-size:11.5px}
  .report:hover{color:var(--warn)}

  /* ---------- 内页 ---------- */
  .page{padding:52px 0 70px}
  .page-head{max-width:760px}
  .page-head h1{font-family:var(--serif);font-weight:400;font-size:31px;margin:0 0 10px;letter-spacing:-.01em}
  .page-head p{color:var(--muted);margin:0 0 30px;font-size:14.5px;line-height:1.85}
  form.card{max-width:760px;padding:32px;display:block;cursor:default;box-shadow:none;border-radius:11px}
  form.card:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;letter-spacing:.01em}
  .field label .req{color:var(--accent);font-weight:400}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
    outline:none;transition:border-color .15s
  }
  .field input::placeholder,.field textarea::placeholder{color:#ABA79E}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#C3BDB0}
  .field textarea{resize:vertical;min-height:88px;line-height:1.75}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.65}
  .field .err{font-size:11.5px;color:var(--warn);margin-top:6px;display:none}
  .field.bad input,.field.bad textarea,.field.bad select{border-color:#DDB3A3}
  .field.bad .err{display:block}
  .agree{
    display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink-soft);
    background:var(--paper-2);border-radius:9px;padding:14px;margin:4px 0 22px;line-height:1.7
  }
  .agree input{width:14px;height:14px;margin-top:4px;flex:none;accent-color:var(--accent)}
  .form-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .form-foot .status{font-size:12.5px;color:var(--warn)}
  .done{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:44px;text-align:center}
  .done .ok{
    width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);
    display:grid;place-items:center;font-size:20px;margin:0 auto 18px
  }
  .done h2{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:22px}
  .done p{color:var(--muted);font-size:13.5px;margin:0 0 24px;line-height:1.8}

  /* ---------- 后台 ---------- */
  .gate{max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:26px}
  .list-item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:20px;margin-bottom:12px}
  .list-item h3{margin:0 0 8px;font-size:15px;font-weight:600}
  .list-item .desc{font-size:13px;color:var(--ink-soft);margin:8px 0;line-height:1.75;white-space:pre-wrap}
  .kv{font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;line-height:1.6}
  .kv a{color:var(--accent-deep);text-decoration:underline;word-break:break-all;font-family:var(--mono);font-size:11px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .acts .btn{padding:6px 13px;font-size:12px}
  .btn.ok{background:var(--ink);border-color:var(--ink);color:#FAF9F5}
  .btn.no{background:transparent;border-color:#DCC1B6;color:var(--warn)}
  .counts{display:flex;gap:22px;font-size:12.5px;color:var(--muted);margin:16px 0 22px}
  .counts span b{color:var(--ink);font-family:var(--serif);font-weight:400;font-size:15px;margin-right:4px}

  /* ---------- 页脚 ---------- */
  footer{border-top:1px solid var(--line-soft);margin-top:30px;padding:24px 0 44px;font-size:12px;color:var(--muted)}
  footer .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  footer .right{margin-left:auto}
  footer a{color:var(--ink-soft);border-bottom:1px solid transparent;padding-bottom:1px}
  footer a:hover{color:var(--accent-deep);border-bottom-color:var(--accent)}

  /* ---------- 界面截图 ---------- */
  .shot{
    margin:-22px -22px 14px;height:150px;overflow:hidden;background:#0D0D0C;
    border-bottom:1px solid var(--line-soft)
  }
  .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block}
  .shot.ph{position:relative;display:flex;align-items:flex-end;height:150px;padding:14px 18px;overflow:hidden;background:linear-gradient(150deg,#F8F5ED,#EDE8D9)}
  .shot.ph em{font-style:normal;font-size:10.5px;letter-spacing:.2em;color:#8E8A7C;position:relative;z-index:1}
  .shot.ph span{position:absolute;right:-2px;bottom:-20px;font-family:var(--serif);font-size:88px;line-height:1;color:#FCFAF2;text-shadow:0 1px 0 #E2DDCB}
  .hero-shot{
    display:block;width:100%;height:236px;object-fit:cover;object-position:50% 32%;
    border:1px solid var(--line-soft);border-radius:9px;margin:2px 0 18px;background:#0D0D0C
  }

  /* ---------- 加载骨架 ---------- */
  .sk-card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .sk-card .b1{
    height:150px;
    background:linear-gradient(100deg,#F1EEE5 20%,#F8F6EF 40%,#F1EEE5 60%);
    background-size:200% 100%;animation:sweep 1.5s linear infinite
  }
  .sk-card .b2{height:15px;margin:18px 22px 0;border-radius:4px;background:#F1EEE5;width:58%}
  .sk-card .b3{height:12px;margin:12px 22px 0;border-radius:4px;background:#F5F2EA}
  .sk-card .b4{height:40px;margin:12px 22px 20px;border-radius:6px;background:#F5F2EA}
  @keyframes sweep{0%{background-position:0% 0}100%{background-position:-200% 0}}

  /* ---------- 引导 ---------- */
  .guide{
    display:grid;grid-template-columns:repeat(3,1fr);margin:30px 0 0;
    border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden
  }
  .guide .step{padding:20px 22px;border-right:1px solid var(--line-soft)}
  .guide .step:last-child{border-right:0}
  .guide .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:9px}
  .guide .step h4{margin:0 0 6px;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
  .guide .step p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.8}

  /* ---------- 收藏 ---------- */
  .fav{
    border:0;background:transparent;padding:0;font-size:14px;line-height:1;color:#C6C1B4;
    cursor:pointer;flex:none;transition:color .15s
  }
  .fav:hover{color:var(--accent)}
  .fav.on{color:var(--accent-deep)}

  /* ---------- 技能云 ---------- */
  .skills{margin:14px 0 0;padding-bottom:10px}
  .skills .h{font-size:11px;color:var(--muted);letter-spacing:.05em;margin-bottom:10px}
  .skills .srow{display:flex;gap:6px;flex-wrap:wrap}
  .skills .sk{
    border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 9px;
    font-size:11.5px;color:var(--ink-soft);transition:.15s
  }
  .skills .sk:hover{border-color:#D8D3C5;color:var(--ink);background:#fff}

  /* ---------- 详情页同场景推荐 ---------- */
  .rel .h{font-size:11px;color:var(--muted);letter-spacing:.05em;margin:20px 0 9px}
  .rel-list{display:flex;flex-direction:column;gap:6px}
  .rel-item{
    text-align:left;border:1px solid var(--line-soft);background:var(--paper-2);border-radius:8px;
    padding:9px 12px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:10px;transition:.15s
  }
  .rel-item:hover{border-color:#D8D3C5;background:#fff}
  .rel-item b{font-weight:600}
  .rel-item span{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}

  @media (max-width:720px){
    .wrap{padding:0 20px}
    .hero{padding:40px 0 12px}
    .statline{gap:14px}
    .stat{padding-right:22px;margin-right:22px}
    nav.links a{padding:7px 8px;font-size:12.5px}
    .row{grid-template-columns:1fr}
    .sheet{padding:22px;margin:0 auto}
    form.card{padding:22px}
    .done{padding:32px 20px}
    .guide{grid-template-columns:1fr}
    footer .wrap.foot{grid-template-columns:1fr;gap:18px}
    .guide .step{border-right:0;border-bottom:1px solid var(--line-soft)}
  }
  /* ---------- 编辑感装饰 ---------- */
  .hero{position:relative;overflow:hidden}
  .hero::after{
    content:"市集";position:absolute;right:-18px;top:-16px;z-index:0;
    font-family:var(--serif);font-size:clamp(110px,16vw,215px);line-height:.86;
    color:#EDE6D3;letter-spacing:.05em;pointer-events:none;user-select:none
  }
  .hero > *{position:relative;z-index:1}

  .badge.official{
    background:transparent;color:var(--accent-deep);
    border:1px solid rgba(217,119,87,.5);border-radius:3px;padding:2px 6px;
    font-family:var(--serif);letter-spacing:.1em;transform:rotate(-3deg);
    box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px rgba(217,119,87,.2)
  }
  .card-foot{
    position:relative;border-top:1px dashed #DBD6C7;
    margin-left:-22px;margin-right:-22px;padding:13px 22px 0
  }
  .card-foot::before,.card-foot::after{
    content:"";position:absolute;top:-7px;width:13px;height:13px;border-radius:50%;background:var(--paper)
  }
  .card-foot::before{left:-8px}
  .card-foot::after{right:-8px}

  .index-note{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#A09C92;
    margin:-8px 0 8px
  }
  .chips .chip{border-radius:3px}

  footer .wrap.foot{display:grid;grid-template-columns:1.3fr .9fr .9fr;gap:26px;align-items:start}
  .fcol{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fcol b{font-family:var(--serif);font-weight:400;font-size:13.5px;color:var(--ink);letter-spacing:.01em;margin-bottom:3px}
  .fcol a{align-self:flex-start}

</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="#/"><span class="mark">台</span>工作台市集</a>
    <nav class="links" id="nav">
      <a href="#/" data-r="/">市集</a>
      <a href="#/submit" data-r="submit">投稿</a>
      <a href="#/about" data-r="about">规则</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap foot">
    <div class="fcol">
      <b>工作台市集</b>
      <span>民间工作台收录站，条目经人工审核</span>
      <span>非豆包官方站点</span>
    </div>
    <div class="fcol">
      <b>索引</b>
      <a href="#/submit">投稿一个工作台</a>
      <a href="#/about">收录规则</a>
      <a href="https://github.com/tomaxiwu-bit/workbench-market" target="_blank" rel="noopener">仓库与 issues</a>
    </div>
    <div class="fcol">
      <b>说明</b>
      <span>分享链接仅指向 doubao.com</span>
      <span>© <span id="yr"></span> 工作台市集</span>
    </div>
  </div>
</footer>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== 常量与状态 ===== */
const REPO = "tomaxiwu-bit/workbench-market";
const SCENES = ['金融投研','医疗健康','教育教学','创意设计','营销增长','写作出版','人力资源','财务行政','求职发展','法律事务','数据分析','科研学术','电商运营','其他'];
const S = { q:'', scene:'', sort:'new', source:'', items:[] };
let DATA = { items: [] };
let META = { scenes: SCENES, stats: { total:0, official:0, authors:0, copies:0 } };

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n >= 10000 ? (n/10000).toFixed(1) + ' 万' : String(n || 0);

async function api(url, opt){
  const r = await fetch(url, opt);
  let j = {};
  try { j = await r.json(); } catch(e){}
  if(!r.ok) throw new Error(j.error || ('请求失败 ' + r.status));
  return j;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok = document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta); return ok;
  }
}
function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#141413;color:#FAF9F5;padding:9px 16px;border-radius:7px;font-size:12.5px;z-index:90;opacity:0;transition:.22s;letter-spacing:.01em';
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.bottom='44px'; });
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),260); }, 1900);
}

/* ===== 路由 ===== */
function route(){
  const h = location.hash.replace(/^#/, '') || '/';
  const nav = $('#nav');
  if(h.startsWith('/item/')){
    renderHome();
    openItem(h.split('/')[2]);
    return;
  }
  nav.querySelectorAll('a').forEach(a=>{
    const r = a.dataset.r;
    a.classList.toggle('on', r === '/' ? h === '/' : h.startsWith('/' + r));
  });
  if(h === '/submit') return renderSubmit();
  if(h === '/about') return renderAbout();
  renderHome();
}
window.addEventListener('hashchange', route);

/* 加载时的骨架卡，避免白屏 */
function skeleton(n){
  return new Array(n).fill(0).map(() =>
    `<div class="sk-card"><div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="b4"></div></div>`
  ).join('');
}

/* ===== 首页 ===== */
async function renderHome(){
  const main = $('#main');
  main.innerHTML = `
    <section class="hero">
      <div class="eyebrow">Workbench Marketplace</div>
      <h1>把好用的<em>工作台</em>，<br>交给同路的人</h1>
      <p class="lead">豆包工作的每个工作台，都是一套预置好的技能、插件与做事偏好。这里收着别人愿意交出来的那一份：有的已经调顺手了，复制链接就能导入；有的写清了「原来卡在哪、第一句话怎么说」，照着搭一遍也就有了。</p>
      <div class="statline" id="stats"></div>
    </section>
    <section class="guide">
      <div class="step">
        <div class="k">Step 01</div>
        <h4>进到市集</h4>
        <p>打开豆包工作电脑版，点左上角「豆包工作」展开下拉，底部「更多工作台」就是市场页。</p>
      </div>
      <div class="step">
        <div class="k">Step 02</div>
        <h4>复制链接导入</h4>
        <p>在工作台市场右上角点「导入」，把卡片里复制的分享链接粘进去，整套技能与插件会一起搬过来。</p>
      </div>
      <div class="step">
        <div class="k">Step 03</div>
        <h4>改成自己的</h4>
        <p>导入后进「我的工作台」点「使用」，偏好指令可以直接改。调顺手了，回头也交一份出来。</p>
      </div>
    </section>
    <div class="toolbar">
      <div class="search"><span class="ico">⌕</span><input id="q" placeholder="搜工作台、技能或作者，例如「面试」「财报」" value="${esc(S.q)}"></div>
      <div class="seg" id="srcseg">
        <button data-s="" class="${S.source===''?'on':''}">全部</button>
        <button data-s="user" class="${S.source==='user'?'on':''}">用户做的</button>
        <button data-s="official" class="${S.source==='official'?'on':''}">官方预置</button>
        <button data-s="fav" class="${S.source==='fav'?'on':''}">我的收藏</button>
      </div>
      <select class="sort" id="sort">
        <option value="new"${S.sort==='new'?' selected':''}>最新收录</option>
        <option value="name"${S.sort==='name'?' selected':''}>名称 A–Z</option>
      </select>
    </div>
    <div class="index-note">按场景 · Index by scene</div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid">${skeleton(6)}</div>
    <section class="skills" id="skillcloud"></section>
  `;
  paintStats();
  paintChips();
  paintSkills();
  $('#q').addEventListener('input', e=>{ S.q = e.target.value; renderGrid(); });
  $('#sort').addEventListener('change', e=>{ S.sort = e.target.value; renderGrid(); });
  $('#srcseg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    S.source = b.dataset.s;
    $('#srcseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x === b));
    renderGrid();
  });
  renderGrid();
}

function paintStats(){  const st = META.stats || {};
  $('#stats').innerHTML = `
    <div class="stat"><b>${fmt(st.total)}</b><span>用户工作台</span></div>
    <div class="stat"><b>${fmt(st.links)}</b><span>可直接导入</span></div>
    <div class="stat"><b>${fmt(st.official)}</b><span>官方预置</span></div>`;
}

function paintChips(){
  const chips = $('#chips');
  chips.innerHTML = ['', ...META.scenes].map(s =>
    `<button class="chip ${S.scene===s?'on':''}" data-s="${esc(s)}">${s ? esc(s) : '全部场景'}</button>`).join('');
  chips.addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    S.scene = b.dataset.s;
    chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x === b));
    renderGrid();
  });
}

async function renderGrid(){
  const grid = $('#grid');
  let list = (DATA.items || []).slice();
  if(S.scene) list = list.filter(i => i.scene === S.scene);
  if(S.source === 'fav'){ const f = getFavs(); list = list.filter(i => f.indexOf(String(i.id)) >= 0); }
  else if(S.source) list = list.filter(i => i.source === S.source);
  const q = S.q.trim().toLowerCase();
  if(q) list = list.filter(i => (i.name + i.summary + i.author + (i.skills || []).join('')).toLowerCase().includes(q));
  list.sort((a, b) => {
    if (S.sort === 'name') return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN');
    if (S.sort === 'hot') {
      const diff = (b.copies || 0) - (a.copies || 0);
      if (diff) return diff;
    }
    // 能直接导入的真人分享在前，其次是配方，官方预置沉底
    const w = x => x.source === 'official' ? 2 : (x.shareUrl ? 0 : 1);
    const k = w(a) - w(b);
    if (k) return k;
    return String(b.approvedAt || '').localeCompare(String(a.approvedAt || ''));
  });
  S.items = list;
  if(!list.length){
    const msg = S.source === 'fav'
      ? '<b>收藏夹还是空的</b>在卡片右上角点一下星标，就能把它留在这里'
      : '<b>这里还没有工作台</b>换个关键词，或者成为第一个投稿的人';
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${msg}</div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

/* 收藏：只存本地，不上传 */
function getFavs(){
  try{ return JSON.parse(localStorage.getItem('wb_favs') || '[]').map(String); }catch(e){ return []; }
}
function toggleFav(id){
  const f = getFavs(), k = String(id), i = f.indexOf(k);
  if(i >= 0) f.splice(i, 1); else f.push(k);
  try{ localStorage.setItem('wb_favs', JSON.stringify(f)); }catch(e){}
  return i < 0;
}

/* 技能云：按出现次数排，点一下直接筛 */
function paintSkills(){
  const box = $('#skillcloud');
  if(!box) return;
  const map = new Map();
  (DATA.items || []).forEach(i => (i.skills || []).forEach(s => {
    const k = String(s).trim();
    if(k) map.set(k, (map.get(k) || 0) + 1);
  }));
  const top = [...map.entries()]
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0], 'zh-Hans-CN'))
    .slice(0, 10);
  if(!top.length){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="h">大家常配的技能，点一下筛出来</div><div class="srow">${
    top.map(([s, n]) => `<button class="sk" data-sk="${esc(s)}">${esc(s)} · ${n}</button>`).join('')}</div>`;
  box.querySelector('.srow').addEventListener('click', e => {
    const b = e.target.closest('[data-sk]');
    if(!b) return;
    S.q = b.dataset.sk;
    const q = $('#q');
    if(q) q.value = S.q;
    renderGrid();
  });
}

/* 有真实界面截图的条目显示封面，其余用浅色首字占位 */
const SHOT_IDS = ['3', '4', '5', '6', '7'];
function shotHTML(it){
  if(SHOT_IDS.indexOf(String(it.id)) >= 0){
    return `<div class="shot"><img src="shots/${it.id}.jpg" alt="${esc(it.name)} 界面预览" loading="lazy"></div>`;
  }
  return `<div class="shot ph"><em>${esc(it.scene || '其他')}</em><span>${esc((it.name || '台').slice(0,1))}</span></div>`;
}

function cardHTML(it){  const skills = (it.skills || []).slice(0,3);
  const on = getFavs().indexOf(String(it.id)) >= 0;
  const badge = it.source==='official'
    ? '<span class="badge official">官方预置</span>'
    : (it.kind==='recipe' ? '<span class="badge">配方 · 可自建</span>' : '<span class="badge">用户分享</span>');
  const footAction = it.shareUrl ? '复制链接' : (it.kind==='recipe' ? '看配方' : '查看说明');
  return `
  <article class="card" data-id="${it.id}">
    ${shotHTML(it)}
    <div class="card-head">
      <div class="ico-box">${esc((it.name || '台').slice(0,1))}</div>
      <div style="flex:1;min-width:0">
        <h3 class="card-title">${esc(it.name)}</h3>
        <div class="card-author">${esc(it.author)} · ${esc(it.scene)}</div>
      </div>
      <button class="fav ${on?'on':''}" data-fav="${it.id}" title="${on?'取消收藏':'收藏'}">${on?'★':'☆'}</button>
      ${badge}
    </div>
    <div class="card-summary">${esc(it.summary)}</div>
    ${it.quote ? `<div class="card-quote">${esc(it.quote)}</div>` : ''}
    <div class="tags">${skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${it.skills.length>3?`<span class="tag">+${it.skills.length-3}</span>`:''}</div>
    <div class="card-foot">
      <span>${esc((it.approvedAt || '').slice(0, 10))}</span>
      <button class="copy" data-copy="${it.id}">${footAction}</button>
    </div>
  </article>`;
}

$('#main').addEventListener('click', async e=>{
  const fv = e.target.closest('[data-fav]');
  if(fv){
    e.stopPropagation();
    const on = toggleFav(fv.dataset.fav);
    fv.classList.toggle('on', on);
    fv.textContent = on ? '★' : '☆';
    fv.title = on ? '取消收藏' : '收藏';
    toast(on ? '已收进收藏夹' : '已取消收藏');
    if(S.source === 'fav') renderGrid();
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if(cp){ e.stopPropagation(); const it = S.items.find(i=>i.id==cp.dataset.copy); if(it) doCopy(it); return; }
  const card = e.target.closest('.card[data-id]');
  if(card) openItem(card.dataset.id);
});

async function openItem(id){
  const it = DATA.items.find(i => String(i.id) === String(id));
  if(it) showSheet(it); else toast('条目不存在');
}

function showSheet(it){
  const sheet = $('#sheet');
  const hasLink = !!it.shareUrl;
  sheet.innerHTML = `
    <div class="sheet-head">
      <div class="ico-box" style="width:42px;height:42px;font-size:18px">${esc((it.name||'台').slice(0,1))}</div>
      <div style="flex:1;min-width:0">
        <h2>${esc(it.name)}</h2>
        <div class="card-author">${esc(it.author)} · 收录于 ${esc((it.approvedAt||it.createdAt||'').slice(0,10))}</div>
      </div>
      <button class="x" onclick="closeSheet()">✕</button>
    </div>
    ${SHOT_IDS.indexOf(String(it.id)) >= 0 ? `<img class="hero-shot" src="shots/${it.id}.jpg" alt="${esc(it.name)} 界面预览">` : ''}
    <div class="meta-row">
      <span class="tag">${esc(it.scene)}</span>
      ${it.source==='official' ? '<span class="badge official">官方预置</span>' : (it.kind==='recipe' ? '<span class="badge">配方 · 可自建</span>' : '<span class="badge">用户分享</span>')}
      <span class="badge">${esc((it.approvedAt || '').slice(0, 10))} 收录</span>
    </div>
    ${it.audience ? `<div class="block"><h3>适合谁</h3><p>${esc(it.audience)}</p></div>` : ''}
    <div class="block"><h3>它解决什么</h3><p>${esc(it.summary)}</p></div>
    ${it.problem ? `<div class="block"><h3>原来卡在哪</h3><p>${esc(it.problem)}</p></div>` : ''}
    ${it.quote ? `<div class="block"><h3>一句原话</h3><p class="q">${esc(it.quote)}</p></div>` : ''}
    ${it.skills.length ? `<div class="block"><h3>预置技能</h3><div class="tags">${it.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div>` : ''}
    ${(it.plugins||[]).length ? `<div class="block"><h3>预置插件</h3><div class="tags">${it.plugins.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div>` : ''}
    ${it.usage && hasLink ? `<div class="block"><h3>怎么用</h3><p>${esc(it.usage)}</p></div>` : ''}
    ${it.starter ? `<div class="block"><h3>开场指令 · 直接复制</h3>
      <div class="link-box"><input readonly value="${esc(it.starter)}"><button class="btn primary" onclick="copyStarter(${it.id})">复制</button></div>
      <div class="tip">新建工作台后把这段贴进偏好设置，再把上面列出的技能勾上，就是这套。</div>
    </div>` : ''}
    <div class="block"><h3>${hasLink ? '导入链接' : '怎么得到它'}</h3>
      ${hasLink ? `<div class="link-box"><input readonly value="${esc(it.shareUrl)}"><button class="btn primary" onclick="doCopyById(${it.id})">复制链接</button></div>
        <div class="tip">在豆包工作里打开「工作台 → 导入」，粘贴这条链接，整套技能与插件会一起搬过来。</div>`
      : (it.kind === 'recipe'
        ? `<p>这条没有现成链接。照上面勾好技能，把「开场指令」贴进新工作台的偏好设置，几分钟就能复刻一套属于你的版本。</p>`
        : `<p>不需要导入。${esc(it.usage || '这是豆包工作自带的预置场景，打开电脑版豆包工作，点左侧「工作台」入口直接切换。')}</p>`)}
    </div>
    ${relHTML(it)}
    <div class="sheet-foot">
      <button class="btn" onclick="doCopyById(${it.id}, true)">复制推荐文案</button>
      <button class="btn ghost" onclick="closeSheet()">关闭</button>
      <button class="report" onclick="reportItem(${it.id})">举报 / 链接失效</button>
    </div>`;
  $('#mask').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  $('#mask').classList.remove('show');
  document.body.style.overflow = '';
  if(location.hash.startsWith('#/item/')) history.replaceState(null,'','#/');
}

function relHTML(it){
  const rel = (DATA.items || []).filter(i => String(i.id) !== String(it.id) && i.scene === it.scene).slice(0, 3);
  if(!rel.length) return '';
  return `<div class="rel">
    <div class="h">同场景的另外几个</div>
    <div class="rel-list">${rel.map(r => `<button class="rel-item" onclick="openItem(${r.id})"><b>${esc(r.name)}</b><span>${esc(r.author)}</span></button>`).join('')}</div>
  </div>`;
}
$('#mask').addEventListener('click', e=>{ if(e.target.id === 'mask') closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeSheet(); });

async function doCopy(it, textOnly){
  if(!it.shareUrl){
    toast(it.kind === 'recipe' ? '这条是配方，照清单自建，没有导入链接' : '这是官方预置场景，打开豆包工作直接切换即可');
    return;
  }
  const text = textOnly
    ? `【工作台推荐】${it.name}\n${it.summary}\n导入链接：${it.shareUrl}`
    : it.shareUrl;
  const ok = await copyText(text);
  toast(ok ? (textOnly ? '推荐文案已复制' : '链接已复制，去豆包工作导入吧') : '复制失败，请手动选中');
}
window.doCopyById = async (id, textOnly)=>{
  const it = S.items.find(i=>i.id==id) || DATA.items.find(i=>i.id==id);
  if(it) doCopy(it, textOnly);
};
window.copyStarter = async id=>{
  const it = DATA.items.find(i => i.id == id);
  if(!it || !it.starter) return;
  const ok = await copyText(it.starter);
  toast(ok ? '开场指令已复制，去新建工作台粘贴' : '复制失败，请手动选中');
};
window.closeSheet = closeSheet;
window.reportItem = async id=>{
  const it = DATA.items.find(i => i.id == id);
  const r = prompt('说说哪里有问题（链接失效 / 内容不当 / 侵权）：');
  if(!r) return;
  const title = `[举报] ${it ? it.name : '#' + id}`;
  const body = `条目：${it ? it.name : id}\n链接：${it && it.shareUrl ? it.shareUrl : '—'}\n问题：${r}`;
  window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, '_blank');
};

/* ===== 启动 ===== */
(async function boot(){
  $('#yr').textContent = new Date().getFullYear();
  try{
    const r = await fetch('items.json', { cache: 'no-store' });
    DATA = await r.json();
  }catch(e){
    console.warn(e);
    DATA = { items: [] };
  }
  const pub = DATA.items || [];
  const user = pub.filter(i => i.source !== 'official');
  META = { scenes: SCENES, stats: {
    total: user.length,
    links: user.filter(i => i.shareUrl).length,
    official: pub.filter(i => i.source === 'official').length,
    authors: new Set(user.map(i => i.author)).size,
    copies: 0
  }};
  route();
})();
</script>
